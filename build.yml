      - name: 3. Commit Unpacked Source Tree to Repository (If Not Yet Committed)
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add settings.gradle.kts build.gradle.kts gradle.properties app/
          if ! git diff --cached --quiet; then
            git commit -m "Auto-unpack Android project structure [skip ci]"
            git push
          fi

      - name: 4. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 5. Setup Gradle 8.6 & Build Debug APK
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.6

      - name: Compile APK with Gradle 8.6
        run: |
          gradle assembleDebug --no-daemon

      - name: 6. Upload Installable APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AimMasterPro-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: 7. Publish APK to GitHub Releases (Automatic Download Link)
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        continue-on-error: true
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Aim Master Pro APK Build #${{ github.run_number }}"
          files: app/build/outputs/apk/debug/app-debug.apk